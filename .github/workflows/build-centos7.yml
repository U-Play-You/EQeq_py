name: Build for CentOS 7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: Python 3.13 / manylinux2014 x86_64
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      MANYLINUX_IMAGE: quay.io/pypa/manylinux2014_x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build CentOS 7 compatible extension
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io" \
            --workdir /io \
            "$MANYLINUX_IMAGE" \
            bash -euxo pipefail -c '
              PYTHON=/opt/python/cp313-cp313/bin/python

              "$PYTHON" -m pip install "pybind11==3.0.2"

              cmake -S . -B build-centos7 \
                -DCMAKE_BUILD_TYPE=Release \
                -DPython3_EXECUTABLE="$PYTHON" \
                -DPython3_ROOT_DIR=/opt/python/cp313-cp313 \
                -Dpybind11_DIR="$("$PYTHON" -m pybind11 --cmakedir)"

              cmake --build build-centos7 --parallel "$(nproc)"

              mkdir -p dist
              cp build-centos7/eqeq*.so dist/

              PYTHONPATH=/io/dist "$PYTHON" -c \
                "import sys, eqeq; print(sys.version); print(eqeq.__doc__); assert callable(eqeq.run)"

              ldd dist/eqeq*.so
              chmod -R a+rwX build-centos7 dist
            '

      - name: Upload Python extension
        uses: actions/upload-artifact@v4
        with:
          name: eqeq-python313-centos7-x86_64
          path: dist/eqeq*.so
          if-no-files-found: error
          retention-days: 30
